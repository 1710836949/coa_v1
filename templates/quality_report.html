<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ material['material_name'] }} 质检报告</title>
    <style>
        /* 全局样式 */
        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 标题样式 */
        h1 {
            background: linear-gradient(135deg, #007BFF 0%, #0056b3 100%);
            color: white;
            text-align: center;
            padding: 25px;
            margin: 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* PDF 容器样式 */
        #pdf-container {
            text-align: center;
            margin: 30px auto;
            position: relative;
            width: 90%;
            max-width: 1300px;
            flex-grow: 1;
        }

        /* PDF 嵌入样式 */
        #pdf-iframe {
            width: 100%;
            height: 100%;
            min-height: 700px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            background-color: white;
            transition: box-shadow 0.3s ease;
        }

        #pdf-iframe:hover {
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        /* 加载提示样式 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            display: none;
            font-size: 1.2rem;
            color: #007BFF;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* 导航按钮样式 */
        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
            font-size: 1.2rem;
            transition: background-color 0.3s ease;
        }

        .nav-button.prev {
            left: -40px;
        }

        .nav-button.next {
            right: -40px;
        }

        .nav-button:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

        /* 返回按钮样式 */
        .back-button {
            display: block;
            width: fit-content;
            margin: 20px auto 30px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color: white;
            border-radius: 30px;
            text-align: center;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.3s ease;
            font-size: 1.1rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .back-button:hover {
            background: linear-gradient(135deg, #5a6268 0%, #495057 100%);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <h1>{{ material['material_name'] }} 质检报告</h1>
    <div id="pdf-container">

        <iframe id="pdf-iframe" src="{{ url_for('download_report', report_path=reports[report_index]['report_path']) }}" width="80%" height="600px" onload="hideLoading()"></iframe>
        {% if report_index > 0 %}
            <button class="nav-button prev" onclick="navigateReport(-1)">&lt; 上一份报告</button>
        {% endif %}
        {% if report_index < reports|length - 1 %}
            <button class="nav-button next" onclick="navigateReport(1)">下一份报告 &gt;</button>
        {% endif %}
    </div>
    <a href="{{ url_for('report_list', material_id=material['id']) }}" class="back-button">返回报告列表</a>

    <script>
        function hideLoading() {
            document.querySelector('.loading').style.display = 'none';
        }

        function navigateReport(direction) {
            const currentIndex = {{ report_index }};
            const newIndex = currentIndex + direction;
            const url = "{{ url_for('view_quality_report', material_id=material['id'], report_index=0) }}".replace('0', newIndex);
            window.location.href = url;
        }

        window.onload = function () {
            if (document.querySelector('#pdf-iframe')) {
                document.querySelector('.loading').style.display = 'block';
            }
        };
    </script>
</body>

</html>
